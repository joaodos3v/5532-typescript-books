<div class="app-container">
  <app-header (sortChange)="onSortChange($event.field, $event.order)"></app-header>

  <main class="main-content">
    @if (highlightedBook()) {
      <app-highlighted-book [book]="highlightedBook()!" (close)="onCloseHighlight()"></app-highlighted-book>
    }
    
    <app-search-box (searchChange)="onSearch($event)"></app-search-box>

    @if (showNoBooks()) {
      <app-no-books></app-no-books>
    } @else {
      <section class="books-section">
        <div class="books-content">
          <p class="results-count">
            {{ filteredBooks().length }} resultado{{
              filteredBooks().length !== 1 ? 's' : ''
            }}
            encontrado{{ filteredBooks().length !== 1 ? 's' : '' }}
          </p>

          <div class="books-grid">
            @for (book of filteredBooks(); track book.title + book.author) {
             <app-book-card [book]="book" (highlight)="onHighlightBook($event)"></app-book-card>
            }
          </div>
        </div>
      </section>
    }
  </main>

  <app-footer></app-footer>
</div>

<router-outlet />
